# =============================================================================
# Portfolio: Docker-only workspace (static React + Vite site)
#
#   docker compose --profile dev up --build             # http://localhost:5173 (HMR)
#   docker compose --profile prod up --build -d         # http://localhost:8080
#   docker compose --profile test run --rm --build e2e  # Playwright E2E
#
# Add --pull to any build (or run `docker compose build --pull`) to refresh the
# floating node:current / nginx:mainline base images. See DOCKER.md.
# =============================================================================

name: portfolio

services:
  # ---- Frontend (development) ------------------------------------------------
  web-dev:
    build:
      context: .
      target: dev
    pull_policy: build
    profiles: [dev, test]
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      VITE_USE_POLLING: "true"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---- Frontend (production) -------------------------------------------------
  web:
    build:
      context: .
      target: prod
    pull_policy: build
    profiles: [prod]
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ---- E2E tests -------------------------------------------------------------
  e2e:
    build:
      context: .
      target: e2e
    pull_policy: build
    profiles: [test]
    environment:
      PLAYWRIGHT_BASE_URL: http://web-dev:5173
      CI: "true"
    volumes:
      - ./test-results:/app/test-results
    ipc: host
    depends_on:
      web-dev:
        condition: service_healthy

volumes:
  node_modules:
